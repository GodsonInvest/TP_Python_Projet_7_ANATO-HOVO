{% extends "base.html" %}
{% block title %}Nouvelle réservation{% endblock %}
{% block heading %}Nouvelle réservation{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
      <p class="text-sm text-slate-500">Remplissez les détails de la réservation. Les conflits horaires sont détectés automatiquement.</p>
    </div>
    <div class="px-6 py-6">
      <form method="POST" class="space-y-5">

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Salle <span class="text-red-500">*</span></label>
          <select name="salle_id" required
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="">— Sélectionner une salle —</option>
            {% for s in salles %}
            <option value="{{ s.id }}">{{ s.nom }} — {{ s.capacite }} places{% if s.equipements %} ({{ s.equipements | join(', ') }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Classe <span class="text-red-500">*</span></label>
            <input type="text" name="classe" required placeholder="ex : L3-INFO"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Matière</label>
            <input type="text" name="matiere" placeholder="ex : Algorithmique"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Date <span class="text-red-500">*</span></label>
          <input type="date" name="date" required min="{{ today }}"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Heure de début <span class="text-red-500">*</span></label>
            <input type="time" name="heure_debut" required
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Heure de fin <span class="text-red-500">*</span></label>
            <input type="time" name="heure_fin" required
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
        </div>

        <div class="flex items-center gap-3 pt-2 border-t border-slate-100">
          <button type="submit" class="btn-primary">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Créer la réservation
          </button>
          <a href="{{ url_for('reservations') }}" class="btn-secondary">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
