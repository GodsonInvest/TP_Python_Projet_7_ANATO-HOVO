{% extends "base.html" %}
{% block title %}Nouvel utilisateur{% endblock %}
{% block heading %}Inscrire un utilisateur{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
      <p class="text-sm text-slate-500">Crée un compte directement sans vérification OTP. Réservé à l'administration.</p>
    </div>
    <div class="px-6 py-6">
      <form method="POST" id="user-form" class="space-y-5">

        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Nom complet <span class="text-red-500">*</span></label>
            <input type="text" name="nom" required placeholder="Alice Dupont"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Email <span class="text-red-500">*</span></label>
            <input type="email" name="email" required placeholder="alice@univ.bj"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Login <span class="text-red-500">*</span></label>
            <input type="text" name="login" required placeholder="alice"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Mot de passe <span class="text-red-500">*</span></label>
            <input type="password" name="mot_de_passe" required placeholder="••••••••"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Rôle <span class="text-red-500">*</span></label>
          <select name="role" id="role-select" onchange="toggleRoleFields()"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="etudiant">Étudiant</option>
            <option value="enseignant">Enseignant</option>
          </select>
        </div>

        <div id="fields-etudiant" class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Matricule</label>
            <input type="text" name="matricule" placeholder="ETU001"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Classe</label>
            <input type="text" name="classe" placeholder="L3-INFO"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
          </div>
        </div>

        <div id="fields-enseignant" class="hidden">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Matière</label>
          <input type="text" name="matiere" placeholder="Algorithmique"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"/>
        </div>

        <div class="flex items-center gap-3 pt-2 border-t border-slate-100">
          <button type="submit" class="btn-primary">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Créer le compte
          </button>
          <a href="{{ url_for('utilisateurs') }}" class="btn-secondary">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
function toggleRoleFields() {
  const r = document.getElementById('role-select').value;
  document.getElementById('fields-etudiant').classList.toggle('hidden', r !== 'etudiant');
  document.getElementById('fields-enseignant').classList.toggle('hidden', r !== 'enseignant');
}
</script>
{% endblock %}
