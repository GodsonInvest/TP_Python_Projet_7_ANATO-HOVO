{% extends "base.html" %}
{% block title %}Nouvel utilisateur{% endblock %}
{% block heading %}Inscrire un utilisateur{% endblock %}

{% block content %}
<div class="max-w-lg">
  <div class="bg-white rounded-xl shadow-sm border px-8 py-6">
    <form method="POST" class="space-y-5" id="user-form">

      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Nom complet <span class="text-red-500">*</span></label>
          <input
            type="text" id="nom" name="nom" required
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            placeholder="ex : Alice Dupont"
          />
        </div>

        <div class="col-span-2">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
          <input
            type="email" id="email" name="email" required
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            placeholder="alice@univ.bj"
          />
        </div>

        <div>
          <label for="login" class="block text-sm font-medium text-gray-700 mb-1">Login <span class="text-red-500">*</span></label>
          <input
            type="text" id="login" name="login" required
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            placeholder="alice"
          />
        </div>

        <div>
          <label for="mot_de_passe" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe <span class="text-red-500">*</span></label>
          <input
            type="password" id="mot_de_passe" name="mot_de_passe" required
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div>
        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Rôle <span class="text-red-500">*</span></label>
        <select id="role" name="role" onchange="toggleRoleFields()"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          <option value="etudiant">Étudiant</option>
          <option value="enseignant">Enseignant</option>
        </select>
      </div>

      <!-- Étudiant fields -->
      <div id="fields-etudiant" class="space-y-4">
        <div>
          <label for="matricule" class="block text-sm font-medium text-gray-700 mb-1">Matricule</label>
          <input
            type="text" id="matricule" name="matricule"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            placeholder="ETU001"
          />
        </div>
        <div>
          <label for="classe" class="block text-sm font-medium text-gray-700 mb-1">Classe</label>
          <input
            type="text" id="classe" name="classe"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            placeholder="L3-INFO"
          />
        </div>
      </div>

      <!-- Enseignant fields -->
      <div id="fields-enseignant" class="hidden">
        <label for="matiere" class="block text-sm font-medium text-gray-700 mb-1">Matière</label>
        <input
          type="text" id="matiere" name="matiere"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          placeholder="Algorithmique"
        />
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition">
          Inscrire
        </button>
        <a href="{{ url_for('utilisateurs') }}"
           class="text-sm text-gray-500 hover:text-gray-700 transition">Annuler</a>
      </div>
    </form>
  </div>
</div>

<script>
function toggleRoleFields() {
  const role = document.getElementById('role').value;
  document.getElementById('fields-etudiant').classList.toggle('hidden', role !== 'etudiant');
  document.getElementById('fields-enseignant').classList.toggle('hidden', role !== 'enseignant');
}
</script>
{% endblock %}
