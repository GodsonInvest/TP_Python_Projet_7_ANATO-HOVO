<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Vérification — UniRéserv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <style>
    body{font-family:'Inter',sans-serif;}
    .otp-input { letter-spacing: 0.5em; font-size: 1.75rem; font-weight: 700; text-align: center; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
    .card-anim { animation: fadeUp 0.3s ease; }
  </style>
</head>
<body class="h-full bg-slate-50 flex items-center justify-center px-4">

  <div class="w-full max-w-md card-anim">

    <!-- En-tête -->
    <div class="text-center mb-8">
      <a href="{{ url_for('login') }}" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-700 text-sm mb-6 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Retour
      </a>
      <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center mx-auto mb-5 shadow-lg shadow-indigo-200">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5H4.5a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Vérifiez votre email</h1>
      <p class="text-slate-500 text-sm">
        Code envoyé à <strong class="text-slate-700">{{ email_masque }}</strong><br/>
        <span class="text-slate-400 text-xs">Valable 5 minutes · 5 tentatives max</span>
      </p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm px-8 py-8">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="mb-5 flex items-start gap-2 rounded-xl px-4 py-3 text-sm border
            {% if category=='success' %}bg-emerald-50 border-emerald-200 text-emerald-800
            {% elif category=='warning' %}bg-amber-50 border-amber-200 text-amber-800
            {% else %}bg-red-50 border-red-200 text-red-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('inscription_verifier') }}">
        <input type="hidden" name="action" value="verifier"/>
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-700 mb-3 text-center">Entrez le code à 6 chiffres</label>
          <input type="text" name="otp" required maxlength="6" minlength="6" pattern="\d{6}"
            inputmode="numeric" autocomplete="one-time-code" autofocus
            class="otp-input w-full rounded-xl border-2 border-slate-200 bg-slate-50 px-4 py-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-all"
            placeholder="000000"/>
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold rounded-xl py-3 text-sm transition-all shadow-md shadow-indigo-200">
          Vérifier le code
        </button>
      </form>

      <div class="flex items-center gap-4 my-5">
        <div class="flex-1 h-px bg-slate-100"></div>
        <span class="text-slate-400 text-xs">ou</span>
        <div class="flex-1 h-px bg-slate-100"></div>
      </div>

      <form method="POST" action="{{ url_for('inscription_verifier') }}">
        <input type="hidden" name="action" value="renvoyer"/>
        <button type="submit"
          class="w-full rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-medium py-2.5 text-sm transition-all">
          Renvoyer un nouveau code
        </button>
      </form>

      <p class="text-center mt-5">
        <a href="{{ url_for('inscription') }}" class="text-sm text-slate-400 hover:text-slate-600 transition">
          Recommencer l'inscription
        </a>
      </p>
    </div>
  </div>

</body>
</html>
