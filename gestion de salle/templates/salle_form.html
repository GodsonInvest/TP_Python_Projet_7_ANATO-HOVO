{% extends "base.html" %}
{% block title %}{{ action }} une salle{% endblock %}
{% block heading %}{{ action }} une salle{% endblock %}

{% block content %}
<div class="max-w-lg">
  <div class="bg-white rounded-xl shadow-sm border px-8 py-6">
    <form method="POST" class="space-y-5">

      <div>
        <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Nom de la salle <span class="text-red-500">*</span></label>
        <input
          type="text" id="nom" name="nom" required
          value="{{ salle.nom if salle else '' }}"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          placeholder="ex : Amphi A"
        />
      </div>

      <div>
        <label for="capacite" class="block text-sm font-medium text-gray-700 mb-1">Capacité <span class="text-red-500">*</span></label>
        <input
          type="number" id="capacite" name="capacite" required min="1"
          value="{{ salle.capacite if salle else '' }}"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          placeholder="ex : 50"
        />
      </div>

      <div>
        <label for="equipements" class="block text-sm font-medium text-gray-700 mb-1">Équipements</label>
        <input
          type="text" id="equipements" name="equipements"
          value="{{ salle.equipements | join(', ') if salle else '' }}"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          placeholder="Projecteur, Tableau blanc, Climatisation"
        />
        <p class="mt-1 text-xs text-gray-400">Séparez les équipements par des virgules.</p>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition">
          {{ action }}
        </button>
        <a href="{{ url_for('salles') }}"
           class="text-sm text-gray-500 hover:text-gray-700 transition">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
