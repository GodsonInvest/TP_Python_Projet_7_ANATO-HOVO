<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Réservation de salles</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-900 flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white">Réservation de salles</h1>
      <p class="text-indigo-300 mt-1 text-sm">Université — Système de gestion</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl px-8 py-10">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">Connexion</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="mb-4 rounded-lg border {% if category == 'success' %}border-green-300 bg-green-50 text-green-800{% else %}border-red-300 bg-red-50 text-red-800{% endif %} px-4 py-3 text-sm">
            {{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
        <div>
          <label for="login" class="block text-sm font-medium text-gray-700 mb-1">Identifiant</label>
          <input
            type="text" id="login" name="login" required autocomplete="username"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="ex : admin"
          />
        </div>

        <div>
          <label for="mot_de_passe" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
          <input
            type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="current-password"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2.5 text-sm transition">
          Se connecter
        </button>
      </form>
      <p class="text-center text-sm text-gray-500 mt-6">
        Pas encore inscrit ?
        <a href="{{ url_for('inscription') }}" class="text-indigo-600 hover:underline font-medium">Créer un compte</a>
      </p>
    </div>
  </div>

</body>
</html>
